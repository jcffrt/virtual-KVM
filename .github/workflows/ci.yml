name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # agent-windows is parked (ADR 0006); keep it compiling without the
      # 8-minute Windows job. ring needs a MinGW C compiler.
      - run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo clippy -p rawkvm-agent-windows -p rawkvm-edge-windows --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  hub-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p rawkvm-hub
      - uses: actions/upload-artifact@v4
        with:
          name: rawkvm-hub-aarch64
          path: target/aarch64-unknown-linux-musl/release/rawkvm-hub

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gadget:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gadget-${{ matrix.target }}
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --target ${{ matrix.target }} -p rawkvm-agent-gadget
      - name: Package
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/rawkvm-agent-gadget package/
          cp deploy/gadget/install.sh deploy/gadget/rawkvm-agent-gadget.service package/
          cp docs/gadget-instalacion.md package/LEEME.md
          git rev-parse HEAD > package/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rawkvm-agent-gadget-${{ matrix.arch }}
          path: package/

  # Edge helper for the Windows PC behind the USB gadget: plain Win32, no
  # WDK, so MinGW on Linux builds it in a minute.
  edge-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: edge-windows
      - run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - run: cargo build --release --target x86_64-pc-windows-gnu -p rawkvm-edge-windows
      - name: Package
        run: |
          mkdir -p package
          cp target/x86_64-pc-windows-gnu/release/rawkvm-edge.exe package/
          cp deploy/windows/install-edge.ps1 deploy/windows/uninstall-edge.ps1 package/
          cp docs/windows-borde.md package/LEEME.md
          git rev-parse HEAD > package/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rawkvm-edge-windows
          path: package/
