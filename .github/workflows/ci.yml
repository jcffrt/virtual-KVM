name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  hub-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p rawkvm-hub
      - uses: actions/upload-artifact@v4
        with:
          name: rawkvm-hub-aarch64
          path: target/aarch64-unknown-linux-musl/release/rawkvm-hub

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gadget:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gadget-${{ matrix.target }}
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --target ${{ matrix.target }} -p rawkvm-agent-gadget
      - name: Package
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/rawkvm-agent-gadget package/
          cp deploy/gadget/install.sh deploy/gadget/rawkvm-agent-gadget.service package/
          cp docs/gadget-instalacion.md package/LEEME.md
          git rev-parse HEAD > package/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rawkvm-agent-gadget-${{ matrix.arch }}
          path: package/

  # Driver + agent package for Windows. windows-2022 ships the WDK
  # (10.0.26100, KMDF, vhfkm.lib, Inf2Cat, signtool); windows-2025 does not.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rawkvm-agent-windows --all-targets -- -D warnings
      - run: cargo test -p rawkvm-agent-windows
      - run: cargo build --release -p rawkvm-agent-windows
      - name: Build driver
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild drivers/windows-vhf/RawKvmVhf.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: InfVerif
        shell: pwsh
        continue-on-error: true
        run: |
          $iv = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Tools" -Recurse -Filter infverif.exe |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          $inf = Get-ChildItem drivers/windows-vhf/build/Release -Recurse -Filter RawKvmVhf.inf | Select-Object -First 1
          & $iv.FullName /v /w $inf.FullName
      - name: Test-sign driver
        shell: pwsh
        # A fresh certificate per build; its private key dies with the runner.
        run: drivers/windows-vhf/sign-test.ps1 -BuildDir drivers/windows-vhf/build/Release -OutDir package/driver
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/rawkvm-agent-windows.exe package/rawkvm-agent.exe
          Copy-Item deploy/windows/install.ps1, deploy/windows/uninstall.ps1 package/
          Copy-Item docs/windows-instalacion.md package/LEEME.md
          git rev-parse HEAD | Out-File package/COMMIT.txt
          Get-ChildItem -Recurse package | Format-Table FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: rawkvm-windows
          path: package/
