# The .debs: hub and gadget (ADR 0022) and the Linux agent (ADR 0023), for
# ci.yml (every push) and release.yml (tags). Builds with zig (static musl
# for the boards, glibc 2.35 for the agent), packages with cargo-deb, runs
# lintian, and installs the packages in containers: the boards' in arm64
# Debian under QEMU (deploy/deb/test-install.sh), the agent's in Ubuntu
# 22.04 and 24.04 (deploy/deb/test-install-agent.sh).
name: debs

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            arch: arm64
          - target: armv7-unknown-linux-musleabihf
            arch: armhf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: debs-${{ matrix.target }}
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild cargo-deb --locked
      - run: cargo zigbuild --release --target ${{ matrix.target }} -p rawkvm-hub -p rawkvm-agent-gadget
      # --no-strip: the release profile already strips, and the host strip
      # does not know ARM binaries.
      - run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} -p rawkvm-hub
          cargo deb --no-build --no-strip --target ${{ matrix.target }} -p rawkvm-agent-gadget
          mkdir -p out
          cp target/debian/*_${{ matrix.arch }}.deb out/
          ls -l out
      - name: lintian (warnings only)
        run: |
          sudo apt-get install -y --no-install-recommends lintian >/dev/null
          lintian --no-tag-display-limit out/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: out/*.deb

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debs-arm64
          path: debs
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: >
          docker run --rm --platform linux/arm64
          -v "$PWD:/repo:ro"
          debian:bookworm
          sh /repo/deploy/deb/test-install.sh /repo/debs /repo

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: debs-agent
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild cargo-deb --locked
      # glibc 2.35: the package installs on Ubuntu 22.04 and later.
      - run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.35 -p rawkvm-agent-linux
      # $auto: dpkg-shlibdeps on the runner works out the libc6 version.
      - run: |
          cargo deb --no-build --no-strip --target x86_64-unknown-linux-gnu -p rawkvm-agent-linux
          mkdir -p out
          cp target/debian/rawkvm-agent_*_amd64.deb out/
          dpkg-deb --field out/*.deb Depends
      - name: lintian (warnings only)
        run: |
          sudo apt-get install -y --no-install-recommends lintian >/dev/null
          lintian --no-tag-display-limit out/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: debs-amd64
          path: out/*.deb

  agent-install-test:
    needs: agent
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debs-amd64
          path: debs
      - run: >
          docker run --rm
          -v "$PWD:/repo:ro"
          ${{ matrix.image }}
          sh /repo/deploy/deb/test-install-agent.sh /repo/debs
