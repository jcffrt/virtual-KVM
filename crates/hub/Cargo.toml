[package]
name = "rawkvm-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RawKVM hub: reads the Unifying receiver and routes raw HID reports"

[lib]
name = "rawkvm_hub"
path = "src/lib.rs"

[[bin]]
name = "rawkvm-hub"
path = "src/main.rs"

# Wi-Fi watchdog of the hub board (ADR 0029).
[[bin]]
name = "rawkvm-netwatch"
path = "src/netwatch_main.rs"

[dependencies]
proto.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
gethostname.workspace = true
hex.workspace = true
mdns-sd.workspace = true
quinn.workspace = true
rand.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
nix.workspace = true

[dev-dependencies]
proto = { workspace = true, features = ["test-fixtures"] }

# `cargo deb --no-build --target aarch64-unknown-linux-musl -p rawkvm-hub`
# after `cargo zigbuild --release --target ...` (release.yml, ADR 0022).
[package.metadata.deb]
name = "rawkvm-hub"
maintainer = "RawKVM <jcffrt@users.noreply.github.com>"
copyright = "RawKVM contributors"
section = "net"
priority = "optional"
revision = ""
# Static musl binary: no shared libraries; systemd for the service.
depends = "systemd"
extended-description = """\
Reads the Logitech receiver (Unifying, Bolt, Lightspeed) and forwards its \
raw HID reports to the RawKVM agents of the PCs over QUIC. Includes the \
blacklist of hid_logitech_dj, a persistent journal, the systemd service and \
rawkvm-netwatch, a Wi-Fi watchdog that restarts the radio when it hangs."""
maintainer-scripts = "../../deploy/deb/hub/"
assets = [
    ["target/release/rawkvm-hub", "usr/bin/", "755"],
    ["target/release/rawkvm-netwatch", "usr/bin/", "755"],
    ["../../deploy/hub-linux/rawkvm-netwatch.service", "lib/systemd/system/", "644"],
    ["../../deploy/hub-linux/rawkvm-netwatch.default", "etc/default/rawkvm-netwatch", "644"],
    ["../../deploy/hub-linux/rawkvm-hub.service", "lib/systemd/system/", "644"],
    ["../../deploy/hub-linux/modprobe-rawkvm.conf", "etc/modprobe.d/rawkvm.conf", "644"],
    ["../../deploy/hub-linux/journald-rawkvm.conf", "etc/systemd/journald.conf.d/rawkvm.conf", "644"],
    ["../../deploy/hub-linux/var-log-journal.mount.in", "usr/share/rawkvm-hub/", "644"],
    ["../../deploy/deb/hub/hub.toml.example", "usr/share/doc/rawkvm-hub/", "644"],
]
