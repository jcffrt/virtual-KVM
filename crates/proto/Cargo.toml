[package]
name = "rawkvm-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wire protocol, HID descriptor helpers and datagram framing for RawKVM"

[lib]
name = "proto"
path = "src/lib.rs"

[dependencies]
bytes.workspace = true
hex.workspace = true
postcard.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
uuid.workspace = true

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
# Export the reference descriptors in `descriptor::tests` to other crates.
test-fixtures = []
